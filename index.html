<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repo File Index</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #222;
      background-color: #fff;
    }

    header {
      padding: 2rem 1.5rem;
      border-bottom: 1px solid #eaeaea;
    }

    header h1 {
      font-size: 1.75rem;
    }

    header p {
      color: #666;
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    ul.tree {
      list-style: none;
      padding-left: 1.25rem;
    }

    ul.tree.root {
      padding-left: 0;
    }

    li {
      margin: 0.15rem 0;
    }

    .entry {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      padding: 0.15rem 0.3rem;
      border-radius: 4px;
    }

    .entry.file:hover {
      background-color: #f6f6f6;
    }

    .icon {
      font-size: 0.9rem;
      width: 1.1rem;
      text-align: center;
      flex-shrink: 0;
    }

    a {
      color: #0645ad;
      text-decoration: none;
      word-break: break-all;
    }

    a:hover {
      text-decoration: underline;
    }

    .dir-name {
      font-weight: 600;
    }

    .meta {
      color: #999;
      font-size: 0.75rem;
      margin-left: 0.4rem;
      white-space: nowrap;
    }

    #status {
      color: #666;
      font-size: 0.9rem;
    }

    footer {
      padding: 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: #999;
      border-top: 1px solid #eaeaea;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Repository File Index</h1>
    <p id="generated-at">Loading listing…</p>
  </header>

  <main>
    <p id="status">Fetching files.json…</p>
    <ul class="tree root" id="tree-root"></ul>
  </main>

  <footer>
    <p>Auto-generated on every build. Do not edit files.json by hand — it's overwritten on each deploy.</p>
  </footer>

  <script>
    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function buildTree(entries) {
      const ul = document.createElement('ul');
      ul.className = 'tree';

      entries.forEach(entry => {
        const li = document.createElement('li');
        const row = document.createElement('div');
        row.className = 'entry ' + entry.type;

        const icon = document.createElement('span');
        icon.className = 'icon';
        icon.textContent = entry.type === 'directory' ? '📁' : '📄';
        row.appendChild(icon);

        if (entry.type === 'directory') {
          const nameSpan = document.createElement('span');
          nameSpan.className = 'dir-name';
          nameSpan.textContent = entry.name + '/';
          row.appendChild(nameSpan);
          li.appendChild(row);

          if (entry.children && entry.children.length > 0) {
            li.appendChild(buildTree(entry.children));
          }
        } else {
          const link = document.createElement('a');
          link.href = entry.path;
          link.textContent = entry.name;
          row.appendChild(link);

          const meta = document.createElement('span');
          meta.className = 'meta';
          meta.textContent = formatBytes(entry.size);
          row.appendChild(meta);

          li.appendChild(row);
        }

        ul.appendChild(li);
      });

      return ul;
    }

    fetch('files.json', { cache: 'no-store' })
      .then(res => {
        if (!res.ok) throw new Error('files.json not found (status ' + res.status + ')');
        return res.json();
      })
      .then(data => {
        document.getElementById('status').remove();
        document.getElementById('generated-at').textContent =
          'Last generated: ' + new Date(data.generatedAt).toLocaleString();
        document.getElementById('tree-root').replaceWith(buildTree(data.entries));
      })
      .catch(err => {
        document.getElementById('status').textContent =
          'Could not load files.json — has it been generated by the build yet? (' + err.message + ')';
      });
  </script>

</body>
</html>
